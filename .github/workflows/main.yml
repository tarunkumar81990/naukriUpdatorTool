name: Naukri Updater Runner

on:
  schedule:
    # Every 30 mins from 03:30 UTC to 15:30 UTC (i.e. 9 AM – 9 PM IST)
    - cron: "30 3-15/1 * * *"
    - cron: "0 4-15/1 * * *"
  workflow_dispatch:  # manual trigger enabled

jobs:
  run-runner:
    runs-on: ubuntu-latest
    env:
      USERNAME: ${{ secrets.APP_USERNAME }}
      PASSWORD: ${{ secrets.APP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Runner main method
        run: |
          echo "Using USERNAME from secrets (hidden in logs)"
          mvn -q compile exec:java -Dexec.mainClass="your.package.Runner"
